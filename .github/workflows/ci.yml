name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Main CI job with lint, test, typecheck, and build
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run

      - name: Type checking
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
        # Note: Build might fail if required env vars are missing in CI
        # In that case, you can uncomment the following lines and add required secrets:
        # env:
        #   NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        #   NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        #   SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        #   RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  # Dependency security audit (runs on push to main and weekly)
  audit:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true  # Don't fail the workflow for vulnerabilities

  # Lighthouse CI for performance budgets (optional, runs on push to main)
  lighthouse-ci:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        # Add required env vars if needed
        # env:
        #   NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        #   NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        #   SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        #   RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Start server for Lighthouse
        run: |
          npm start &
          SERVER_PID=$!
          # Wait for server to be ready
          sleep 10

      - name: Run Lighthouse CI
        run: npx lhci autorestart --collect.staticDistDir=.next --upload.target=temporary-public-storage || echo "LHCI completed"

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true