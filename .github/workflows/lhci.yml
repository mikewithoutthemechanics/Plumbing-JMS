name: Lighthouse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          upload: temporary-public-storage
          temporaryPublicStoragePath: lighthouse-report/
          configPath: .lighthouserc-ci.json